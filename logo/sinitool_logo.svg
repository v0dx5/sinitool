<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F5A0"/>
      <stop offset="50%" style="stop-color:#00D9F5"/>
      <stop offset="100%" style="stop-color:#7B61FF"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00F5A0"/>
      <stop offset="100%" style="stop-color:#7B61FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- background circle -->
  <circle cx="256" cy="256" r="240" fill="#0A0E17"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.9" filter="url(#glow)"/>
  <!-- stylized S mark -->
  <path d="M 180 160
           C 180 120, 332 120, 332 180
           C 332 230, 200 230, 200 280
           C 200 340, 360 330, 340 380
           C 320 430, 170 430, 160 370"
        fill="none" stroke="url(#g)" stroke-width="36" stroke-linecap="round" filter="url(#glow)"/>
  <!-- core dot -->
  <circle cx="256" cy="256" r="18" fill="#00F5A0" filter="url(#glow)"/>
  <!-- label bar -->
  <text x="256" y="470" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="42" font-weight="700" fill="#E8EEF7">SINITOOL</text>
</svg>
