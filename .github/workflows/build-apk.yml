name: Build SiniTool APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi
          mkdir -p app/src/main/assets
          cp -f scripts/sini_core.sh app/src/main/assets/sini_core.sh || true

      - name: Gradle wrapper (if missing)
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2 2>/dev/null || true
          fi
          chmod +x gradlew 2>/dev/null || true

      - name: Build debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon
          else
            # fallback: install gradle and generate wrapper
            sudo apt-get update -qq && sudo apt-get install -y -qq gradle
            gradle wrapper --gradle-version 8.2
            chmod +x gradlew
            ./gradlew :app:assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sinitool-apk
          path: app/build/outputs/apk/debug/*.apk
